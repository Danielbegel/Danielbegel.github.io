<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography Portfolio</title>
    <style>
        /* CSS Variables for easy color changes */
        :root {
            --bg-color: #fafafa;
            --text-color: #333333;
            --accent-color: #555555;
        }

        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* Header Styling */
        header {
            text-align: center;
            padding: 60px 20px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1rem;
            color: var(--accent-color);
        }

        /* Gallery Grid Setup */
        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        .gallery {
            display: grid;
            /* Creates responsive columns: minimum 300px wide, expanding to fill available space */
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }

        /* Image Container for Hover Effects */
        .gallery-item {
            overflow: hidden;
            border-radius: 4px;
            background-color: #eeeeee;
            aspect-ratio: 1 / 1; /* Keeps images perfectly square */
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures the image fills the square without distorting */
            transition: transform 0.4s ease;
            display: block;
        }

        /* Hover Zoom Effect */
        .gallery-item:hover img {
            transform: scale(1.08);
            cursor: pointer;
        }

        /* Footer Styling */
        footer {
            text-align: center;
            padding: 30px;
            font-size: 0.9rem;
            color: var(--accent-color);
            border-top: 1px solid #eaeaea;
        }
    </style>
</head>
<body>

    <header>
        <h1>Daniel Begel</h1>
        <p>Totally not vibe coded</p>
    </header>

    <div class="gallery-container">
        <main class="gallery">
            <!-- Using Lorem Picsum for placeholder photography -->
            <div class="gallery-item">
                <img src="https://unsplash.com/photos/birds-perched-on-a-rock-formation-in-the-ocean-28spcCW5HKY" alt="Long Exposure in Santa Cruz" loading="lazy">
            </div>
        </main>
    </div>

    <footer>
        <p>&copy; 2026 J. Doe Photography. All rights reserved.</p>
    </footer>

</body>
</html>
